# w11_vmcall_identity, Phase 1 (T1 and T2 in one boot). Needs a Composite system built with
# VMCALL_IDENTITY and VMCALL_RESUME_RIP3 on (registration is a ring-0 vmcall that only the
# identity build sends to the VMM; with the switches off it would take the old fast path).
# Compose composition_scripts/vmm_vm_ipc_test.toml. Build with KVER=5.15.107.
description = "identity phase 1: P registered (check, T1), P holding while Q and ring 0 try (T2)"
init        = "run_identity1.sh"
programs    = ["ipc_perf.c"]
modules     = ["errand_id.c"]
