# nginx for the TLS key errand, Phase 3 (cut 1): the certificate of the tlskey service's signing key
# and a placeholder key file (the public point, scalar 1). With TLS_ERRAND=sign or sign+records
# the errand provider signs the CertificateVerify by a SIGN errand; otherwise the handshake fails.
# Otherwise identical to nginx.conf: one worker, TLS 1.3 with AES-128-GCM only, loopback, no logs.
# The errand provider (Phase 2) is selected by the environment at start, not here.
user root;
worker_processes 1;
error_log /nginx/logs/error.log warn;
pid /nginx/logs/nginx.pid;

events { worker_connections 1024; }

http {
	default_type application/octet-stream;
	access_log off;
	sendfile on;
	keepalive_requests 10000000;
	keepalive_timeout 300;

	server {
		listen 127.0.0.1:443 ssl;
		server_name localhost;
		ssl_certificate /nginx/conf/cert-sign.pem;
		ssl_certificate_key /nginx/conf/key-placeholder.pem;
		ssl_protocols TLSv1.3;
		ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;
		ssl_session_cache off;
		ssl_session_tickets off;
		root /nginx/html;
	}
}
